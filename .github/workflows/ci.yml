name: CI

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: Backend

jobs:
  backend:
    name: Backend (tests, phpstan, pint)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ampare_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip, dom, xml, curl
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot --silent && break
            sleep 2
          done

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ampare_management_test
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Pint (format check)
        run: vendor/bin/pint --test

      - name: Check broadcasting config (PROD-01)
        # Only hard-fails in a real production environment (see
        # CheckBroadcastingConfig.php) — informational here, since this job
        # runs against .env.example's dev-oriented defaults, not a real
        # production .env. Included per DEVOPS-002 so the command itself is
        # exercised on every run, catching a regression to the check's own
        # tooling; its actual hard-fail value applies once a real deploy
        # pipeline runs it against production's real environment.
        run: php artisan broadcasting:check-config

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
